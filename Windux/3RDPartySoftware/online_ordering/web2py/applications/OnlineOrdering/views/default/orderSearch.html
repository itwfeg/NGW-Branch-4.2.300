<div class="modal" id="statusModal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Change the status of this order?</h4>
        </div>
      <div class="modal-body" id="statusModal-body">
        <div class="form-group row justify-content-between">
          <label for="statusModal-orderNumber" class="col-2">ID</label>
          <input type="text" class="form-control form-control-lg contrast-readonly col-7" id="statusModal-orderNumber" placeholder="" readonly>
        </div>
        <div class="form-group row justify-content-between">
          <label for="statusModal-customer" class="col-2">Customer</label>
          <input type="text" class="form-control form-control-lg contrast-readonly col-7" id="statusModal-customer" placeholder="" readonly>
        </div>
        <div class="form-group row justify-content-between">
          <label for="statusModal-deliveryTime" class="col-2">Time</label>
          <input type="text" class="form-control form-control-lg contrast-readonly col-7" id="statusModal-deliveryTime" placeholder="" readonly>
        </div>
        <div class="form-group row justify-content-between">
          <select id="statusModal-select" class="form-control form-control-lg col-12">
            <!--<option value="0">Received</option>-->
            <option value="1">Waiting</option>
            <option value="2">In progress</option>
            <option value="3">Ready</option>
            <!--<option value="4">Delivered</option>-->
            <option value="5">Cancelled</option>
            <!--<option value="6">Rejected</option>-->
            <!--<option value="7">Error</option>-->
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <div class="row">
          <div class="col-6"><button type="button" class="btn btn-danger btn-lg" id="statusModal-keep" data-dismiss="modal">Keep Status</button></div>
          <div class="col-6"><button type="button" class="btn btn-hobart btn-lg" id="statusModal-status" data-dismiss="modal">Change Status</button></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="filterModal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Filter Orders</h4>
        </div>
      <div class="modal-body" id="filterModal-body">
        <div class="form-group row justify-content-between">
          <label for="filterModal-orderNumber" class="col-2">Number</label>
          <input type="text" class="form-control form-control-lg col-7" id="filterModal-orderNumber" placeholder="">
        </div>
        <div class="form-group row justify-content-between">
          <label for="filterModal-customer" class="col-2">Name</label>
          <input type="text" class="form-control form-control-lg col-7" id="filterModal-customer" placeholder="">
        </div>
        <div class="form-group row justify-content-between">
          <label for="filterModal-deliveryTime" class="col-2">Time</label>
          <input type="text" class="form-control form-control-lg col-7" id="filterModal-deliveryTime" placeholder="">
        </div>
        <div class="form-group row justify-content-between">
          <select id="filterModal-select" class="form-control form-control-lg col-12">
            <!--<option value="0">Received</option>-->
            <option value="1">Waiting</option>
            <option value="2">In progress</option>
            <option value="3">Ready</option>
            <!--<option value="4">Delivered</option>-->
            <option value="5">Cancelled</option>
            <!--<option value="6">Rejected</option>-->
            <!--<option value="7">Error</option>-->
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <div class="row">
          <div class="col-6"><button type="button" class="btn btn-danger btn-lg" id="filterModal-keep" data-dismiss="modal">Keep Status</button></div>
          <div class="col-6"><button type="button" class="btn btn-hobart btn-lg" id="filterModal-status" data-dismiss="modal">Change Status</button></div>
        </div>
      </div>
    </div>
  </div>
</div>

# Advertisement Service configuration parameters
[WEB SERVICE]

# Time to wait in minutes before checking web service for new advertisements
# Walmart sync check time is 15 minutes
# sync_check_time_delta = 15

# For testing set sync check time to 1 minute so all testing can be done
# quickly versus waiting 15 minutes for next open window to potentially sync
sync_check_time_delta = 1

# Maximum size of advertising file in MB that this service would retrieve before
# a warning is emitted to log file.  The file will still be downloaded
maximum_advertising_file_size_before_warning = 4

# Maximum number of advertising files that this service would capture during update sequence, scale will capture
# more but will warn after the number of files below is reached
maximum_number_advertising_files_before_warning = 10

# request custom header which is required for the request commands below
request_custom_header = accept: */*

# connection_type
# can be http or https, if https used there is no ssl certificate verification
# Walmart connection type must be https
# connection_type = https

# Filebox Simulation Server connection type is http
connection_type = http

# Walmart Filebox Server hostname
# server_ip_or_hostname = pos-scanitem-services.qa.walmart.com

# Filebox Simulation Server IP address or hostname
server_ip_or_hostname = 10.3.176.117

# Walmart Filebox Server port
# server_port = 443

# Filebox Simulation Server port number
server_port = 8000

# https connections can not be verified with SSL certificates at this time
# the setting below must be False even for https
verify_https_connection = False

# get list of active files request format from web service
get_list_of_active_files_request = %(connection_type)s://%(server_ip_or_hostname)s:%(server_port)s/filebox/getListOfActiveFiles/${country_code}/${store_number}/${device_id}

# get specified file request format from web service
get_specified_file_request = %(connection_type)s://%(server_ip_or_hostname)s:%(server_port)s/filebox/getFile/${directory_number}/${filename}

# web service files to ignore
ignore_file_list = main.png, nof.png, header.png

# Filebox Simulation Server web service connection timeout in seconds which is
# the time to wait for connection to occur with web service
connection_timeout = 3.0

# Walmart web service connection timeout in seconds which is
# the time to wait for connection to occur with web service
# the Walmart web service is quite slow to respond to requests
# connection_timeout = 6.0

# Filebox Simulation Server web service request timeout in seconds which is
# the time to wait for a response from the web service
response_timeout = 5.0

# Walmart web service request timeout in seconds which is
# the time to wait for a response from the web service
# the Walmart web service is quite slow to respond to requests
# response_timeout = 12.0

[AD SERVICE]

# country code of store this scale is located, values can be MX, CA, US
# this value is typically determined by the scale country code value stored in the scale database, if this is explicitly
# set in this file by uncommenting the line below this value will be used instead
# country_code = MX

# store number where this store is located
# this value is typically determined by the scale store number value stored in the scale database, if this is explicitly
# set in this file by uncommenting the line below this value will be used instead
# store_number = 1

# status alerts filename
status_alerts_filename = ad_service_alerts.dat

# supported image file types contains the file extensions that this service supports for static images
supported_image_file_types = jpg, jpeg, png

# supported file types contains the file extensions that this service supports for videos
supported_video_file_types = mp4

# empty ad playlist image file that is displayed if web service was syncable but returned empty ad file list
empty_playlist_image_filename=ad_service_empty_playlist.png

# maximum number of web service get file attempts before error
maximum_get_file_request_attempts=1

# maximum number of web service get list of active files request attempts
maximum_get_list_of_active_files_request_attempts=1

# delay in seconds to pause before next media type is displayed
playlist_media_delay = 20

# playlist default audio file to be played during a slideshow only presentation consisting of static image if specified
playlist_audio_filename = None

# maximum number of video files allowed in a playlist, if exceeded playlist will be truncated at 99
playlist_maximum_video_files = 99

# maximum number of image files allowed in a playlist, if exceeded playlist will be truncated at 99
playlist_maximum_image_files = 99

# MD5 Checksum block size, default 256*128=32,768
md5_checksum_block_size = 32768

# flag set to perform detailed logging or remote print operations
# options for this setting are DEBUG, INFO, WARNING, ERROR, CRITICAL
logging_level = DEBUG


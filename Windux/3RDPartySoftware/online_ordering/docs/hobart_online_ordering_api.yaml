        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  description: Filename to save this image as.  Legal characters are "1234567890-=qwertyuiop[]asdfghjklzxcvbnm. _()+QWERTYUIOPASDFGHJKLZXCVBNM"
                  type: string
                image:
                  description:  Base64-encoded image (must be a gif, png, jpg).
                  type: string
      responses:
        '200':
          description: Image successfully uploaded.


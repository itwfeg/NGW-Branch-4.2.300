{{extend 'layout.html'}}
{{=P('HISTORY')}}
<FONT SIZE="2">
    {{=form}}
    <TABLE>
        <TR>
            <TD>
                <form action="/PillarSync/default/delete_all_history" method="POST">
                    <input type="hidden" name="_method" value="DELETE">
                    <input type="hidden" name="_token" value="the_token">
                    <button type="submit"
                            class="btn btn-link"
                            onclick="if (!confirm('Are you sure, history data is unrecoverable?')) { return false }">
                        <span class="btn-default btn-secondary buttontext button btn"
                              title="DELETE ALL">DELETE ALL</span>
                    </button>
                </form>
            </TD>
             <TD>
                <form action="/PillarSync/default/format_usd_card" method="POST">
                    <input type="hidden" name="_method" value="FORMAT">
                    <input type="hidden" name="_token" value="the_token">
                    <button type="submit"
                            class="btn btn-link"
                            onclick="if (!confirm('Are you sure, ALL DATA on inserted micro SD card will be ERASED?')) { return false }">
                        <span class="btn-default btn-secondary buttontext button btn"
                              title="FORMAT">FORMAT <IMG SRC="/PillarSync/static/images/sd_card.png"></span>
                    </button>
                </form>
            </TD>
            <TD>
                <a class="button btn btn-default btn-secondary" href="/PillarSync/default/help_history.html">
                    <span class="buttontext button" title="Help">Help</span>
                </a>
            </TD>
        </TR>
    </TABLE>
</FONT>

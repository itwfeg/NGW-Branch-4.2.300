; App configuration
[app]
name        = OnlineOrdering
production  = true

; Host configuration
[host]
names = localhost:*, 127.0.0.1:*, *:*, *

; db configuration
[db]
#uri       = sqlite://storage.sqlite
#uri = postgres://hobart:hobart@localhost:5432/online_ordering
uri = mysql://hobart:hobart@localhost/online_ordering
migrate   = false
pool_size = 10  

[scheduler]
enabled   = false
heartbeat = 1


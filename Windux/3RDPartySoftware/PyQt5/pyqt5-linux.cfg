# The configuration for building PyQt5 for Linux.

# The target Python installation.
py_platform = linux
py_inc_dir = %(sysroot)/include/python%(py_major).%(py_minor)
py_pylib_dir = %(sysroot)/lib
py_pylib_lib = python%(py_major).%(py_minor)

# The target PyQt installation.
pyqt_module_dir = %(sysroot)/lib/python%(py_major).%(py_minor)/site-packages
pyqt_sip_dir = %(sysroot)/share/sip/PyQt5

# Qt configuration common to all versions.
qt_shared = False

[Qt 5.5]
pyqt_disabled_features = PyQt_Desktop_OpenGL
pyqt_modules = QtBluetooth QtCore QtDBus QtGui QtHelp QtLocation QtMultimedia
    QtMultimediaWidgets QtNetwork QtNfc QtPositioning QtPrintSupport
    QtQml QtQuick QtSensors QtSerialPort QtSql QtSvg QtTest
    QtWebChannel QtWebSockets QtWidgets QtX11Extras QtXml QtXmlPatterns
    Enginio QtWebKit QtWebKitWidgets


# This is the configuration defaults file
db.primarydb=SQLite

# Primary database configuration parameters
# Note: In Codebase, all field names need to be in "all-caps" because that is
# how Codebase stores field names.

# Database-scope fields:
# - path: path to the database files
# - Tables.*: * table's filename.
# - primaryLanguageCode: primary database language code
# - secondaryLanguageCode: secondary database language code
# - checkAutoIncrementKeys: whether the database checks issued auto-increment
#   values in case they are already being used (requires the auto-increment tag
#   to be set in the corresponding table)
# - lockFailedDelay: delay before re-attempting a failed lock
# - useZapAPI: whether to use Codebase's zap API. Default is 'Y'.

# Table-scope fields:
# - doNothing: whether the corresponding record manager will pretend to do what
#   is asked for but actually do nothing. Default is 'N'.
# - doReads: whether the corresponding record manager will pretend to read data
#   but actually do nothing (return null). Default is 'Y'.
# - doSaves: whether the corresponding record manager will pretend to save data
#   but actually do nothing. Default is 'Y'.
# - doDeletes: whether the corresponding record manager will pretend to delete
#   data but actually do nothing. Default is 'Y'.
# - primaryKey: name of the primary key field(s), if any.
# - primaryIndex: name of the primary index, if any.
# - checkField: name of the table's check field.
# - autoIncrementField: name of the table's auto-increment field, if any.
# - singleRecord: whether the table is only allowed to contain a single record
#   ('Y') or not ('N'). Default is 'N'.
# - readOnly: whether the table is only allowed to contain records, but not to
#   modify them or to create new or delete existing ones.
# - checkBeforeBackup: whether the table is to be checked before a backup is
#   performed. Default is 'N'.
# - throwOnUnlockFailure: whether to throw an exception when unlocking fails.
#   Default is 'Y'.

# Field-scope fields:
# - autoIncrementTag: name of the tag associated with the auto-increment field,
#   if any (used for validation of auto-increment values).

# Index-scope fields:
# - strictMatching: whether a particular index should perform strict matching
#   when seeking for a character string (implemented for primary indices only).



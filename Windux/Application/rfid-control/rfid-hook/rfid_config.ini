; Default configuration file for RFID Reader
[Reader]
URI = tmr:///dev/ttyACM1
DefaultReadPower = 250
DefaultWritePower = 2400

[ReadTID]
RetryCount = 4
RetryPowerIncrement = 50

[WriteEPC]
RetryCount = 4
RetryPowerIncrement = 100

[Logging]
TransportTraffic = false
Level = DEBUG
ColoredOutput = false
OutputDirectory = /var/log/rfid

[Operation]
AutoCalibrate = false
ReadAutoCalibrate = false
WriteAutoCalibrate = false
AutoCalibrateOnSizing = false
AutoCalibrateOnInit = false
ReadAutoCalibrateOnSizing = false
ReadAutoCalibrateOnInit = false
WriteAutoCalibrateOnSizing = false
WriteAutoCalibrateOnInit = false
Region = 1
EncodingProtocol = DSGTIN_128
ReadTime = 750
CommandTimeout = 1000
ReadTimeout = 750

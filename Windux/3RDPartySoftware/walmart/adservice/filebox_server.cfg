[SERVICE]

# http connection
# can be http or https, currently only http supported
connection_type = http

# Filebox Simulation service IP address or hostname
# server_ip_or_hostname = 127.0.0.1
server_ip_or_hostname = 10.3.176.117

# Filebox Simulation service port number
server_port = 8000

get_list_of_active_files_request = %(connection_type)s://%(server_ip_or_hostname)s:%(server_port)s/filebox/getListOfActiveFiles/

# set the syncable flag to True or False to simulate opening and closing window for media file synchronization
set_syncable_request=%(connection_type)s://%(server_ip_or_hostname)s:%(server_port)s/filebox/setSyncable/${syncable}

# remove file URL only
remove_file_request = %(connection_type)s://%(server_ip_or_hostname)s:%(server_port)s/filebox/removeFile/${directory_number}/${filename}

# remove file URL only
create_file_request = %(connection_type)s://%(server_ip_or_hostname)s:%(server_port)s/filebox/createFile/${directory_number}/${filename}

# remove file URL only
restore_file_request = %(connection_type)s://%(server_ip_or_hostname)s:%(server_port)s/filebox/restoreFile/${directory_number}/${filename}

# remove all files URL only
remove_all_files_request = %(connection_type)s://%(server_ip_or_hostname)s:%(server_port)s/filebox/removeAllFiles/

# restore all files URL only
restore_all_files_request = %(connection_type)s://%(server_ip_or_hostname)s:%(server_port)s/filebox/restoreAllFiles/

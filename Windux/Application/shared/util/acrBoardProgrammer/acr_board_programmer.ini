[GENERAL]
logging_level=debug
# set to True if scanner connected to support scanning datamatrix symbol on board
scanner_support = True

# serial port device for RPI
# serial_port = /dev/ttys0
# serial port device for Windows
# serial_port = COM3
serial_port = /dev/ttys0

# barcode scanner device for RPI
# barcode_scanner_device = /dev/ttyACM0
# barcode scanner device for Windows
# barcode_scanner_device = COM4
barcode_scanner_device = /dev/ttyACM0

[DATAMATRIX_FORMAT]
# Location of board part number and serial number in returned
# Datamatrix stream, adjust as needed should format change
# at this time the following data items are supported
# board type designator such as surface mount = SM
# hobart part number and revision such as 00-449970-2A1
# RoHS compliant designator = RC
# CM numerical revision = A
# Serial number = MMDDYY{serial_number}
#
# All offsets specified below start from 0
#           1         2
# 012345678901234567890123456
# SM449970-2A1RC A 0204200029
required_format_length = 27
board_type_start = 0
board_type_end = 1
part_number_start = 2
part_number_end = 11
rohs_compliant_start = 12
rohs_compliant_end = 13
revision_number_start = 14
revision_number_end = 16
manufacture_date_start = 17
manufacture_date_end = 22
serial_number_start = 23
serial_number_end = 26

[BOARD_PART_NUMBERS]
#                                     # NAME  RAM_TYPE  RAM_SIZE  CPU_CORES  CPU_SPEED  IN_PRODUCTION
448410 = u-boot-s-x.x.xx.imx          # ARA   KINGSTON  1         1          1.0        YES
# 448420-1 = u-boot-x.x.xx.imx          # ARA   SKYHNIX   1         2          1.0        YES
# 448420-2 = u-boot-issi-x.x.xx.imx     # ARA   ISSI      1         2          1.0        YES
448420-3 = u-boot-x.x.xx.imx          # ARA   KINGSTON  1         2          1.0        YES
# 448480                              # ARA   SKYHNIX   1         2          1.2        NO
449970-2 = u-boot-ark-dq-x.x.xx.imx   # ARK   ISSI      2         2          1.0        YES
# 449970-2                            # ARK   SKYHNIX   2         2          1.0        NO

[BOARD_TEST_SERVER]
# Current Sigmatron pool number to use, when exhausted use next available mac address pool in
# board_test_server.ini file
mac_address_pool_number = 5
# set to localhost if board test server is running locally to this board programmer
# specify IP address if running remotely in network
ip_address = localhost
# port number that the board test server is listening on
port = 5081
# board test server timeout value before communication is aborted
timeout = 3.0

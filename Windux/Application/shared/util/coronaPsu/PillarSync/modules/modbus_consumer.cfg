[MQTT]
enabled = False
sparkplug_enabled = False
broker_ip_address = None
broker_port = 1883
broker_username = None
broker_password = None

[MODBUS_CONSUMER]
# time in seconds to average power, voltage, current, frequency and count faults from power supply
# before recording the data to the micro SD card, value should not be less than 30
sample_frequency = 30

# flag set to perform detailed logging
# options for this setting are DEBUG, INFO, WARNING, ERROR, CRITICAL
logging_level = ERROR

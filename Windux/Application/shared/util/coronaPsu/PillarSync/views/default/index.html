{{extend 'layout.html'}}
{{=P('DASHBOARD')}}
<TABLE>
    <TR>
        <TD>
            <figure>
                <embed type="image/svg+xml" src="{{=power_plot}}" width="400" height="300"/>
            </figure>
            <CENTER><FONT SIZE="1">{{=power_form}}</FONT></CENTER>
            <br>
        </TD>
        <TD>
            <figure>
                <embed type="image/svg+xml" src="{{=voltage_plot}}" width="400" height="300"/>
            </figure>
            <CENTER><FONT SIZE="1">{{=voltage_form}}</FONT></CENTER>
            <br>
        </TD>
        <TD>
            <figure>
                <embed type="image/svg+xml" src="{{=faults_plot}}" width="400" height="300"/>
            </figure>
            <CENTER><FONT SIZE="1">{{=faults_form}}</FONT></CENTER>
            <br>
        </TD>
    </TR>
    <TR>
        <TD>
            <figure>
                <embed type="image/svg+xml" src="{{=current_plot}}" width="400" height="300"/>
            </figure>
            <CENTER><FONT SIZE="1">{{=current_form}}</FONT></CENTER>
            <br>

        </TD>
        <TD>
            <figure>
                <embed type="image/svg+xml" src="{{=frequency_plot}}" width="400" height="300"/>
            </figure>
            <CENTER><FONT SIZE="1">{{=frequency_form}}</FONT></CENTER>
            <br>
        </TD>
        <TD>
            <figure>
                <embed type="image/svg+xml" src="{{=supply_levels_plot}}" width="400" height="300"/>
            </figure>
            <CENTER><FONT SIZE="1">{{=supply_levels_form}}</FONT></CENTER>
            <br>
        </TD>
    </TR>
    <TR>
        <TD>
            {{=interpolate_form}}
        </TD>
        <TD>
            {{=group_by_form}}
        </TD>
        <TD ALIGN="RIGHT">
            <a class="button btn btn-default btn-secondary" href="/PillarSync/default/help_dashboard.html">
                <span class="buttontext button" title="Help">Help</span>
            </a>
        </TD>
    </TR>
</TABLE>

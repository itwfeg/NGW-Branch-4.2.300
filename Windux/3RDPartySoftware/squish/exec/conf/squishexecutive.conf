# The number of events/lines in the final recorded script
maximumEventCount=32768

# The path to the root of your Squish installation
squishPath=/usr

# The name under which the AUT is registered in the server
applicationName=attachScaleUI

# The full path to the objects.map file, which will be
# created if it doesn't exist
objectMapFileName=/root/.squish/objects.map

# Port number for the server to listen for connections on
serverPort=16555

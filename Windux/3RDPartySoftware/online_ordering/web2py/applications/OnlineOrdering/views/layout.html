<!DOCTYPE html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{=response.title or request.application}}</title>
    <link rel="stylesheet" href="{{=URL('static','css/bootstrap.min.css')}}"/>
    <link rel="stylesheet" href="{{=URL('static','css/online_ordering.css')}}"/>
    <link rel="shortcut icon" href="/OnlineOrdering/static/images/favicon.ico" type="image/x-icon">
    {{
    if currentSettingsJSON:
      response.write('<script id="currentSettingsScript">var currentSettings = ', escape=False)
      response.write(currentSettingsJSON, escape=False)
      response.write(";</script>", escape=False)
    pass
    }}
    {{block head}}
    {{end}}
  </head>
  <body>
    {{block header}}
    {{end}}
    
    <!-- modals that can be used on various pages -->
    <div class="modal" id="operatorModal" tabindex="-1" role="dialog">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-body" id="operatorModal-body">
            <p id="operatorModal-bodytext">Enter your operator ID</p>
            <form id="operatorModal-form">
              <div class="form-group">
                <input type="text" class="form-control form-control-lg contrast-rw" id="operatorModal-operator" placeholder="">
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-hobart btn-lg" id="operatorModal-cancel" data-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger btn-lg" id="operatorModal-button">Continue</button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="modal" id="failureModal" tabindex="-1" role="dialog">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-body" id="failureModal-body">
            Failed.
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-danger btn-lg" id="failureModal-cancel" data-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="modal" id="cancelModal" tabindex="-1" role="dialog">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
              <h4 class="modal-title">Cancel this order?</h4>
            </div>
          <div class="modal-body" id="cancelModal-body">
            <div class="form-group row justify-content-between">
              <label for="cancelModal-customer" class="col-2">Order</label>
              <input type="text" class="form-control form-control-lg contrast-readonly col-7" id="cancelModal-orderNumber" placeholder="" readonly>
            </div>
            <div class="form-group row justify-content-between">
              <label for="cancelModal-customer" class="col-2">Customer</label>
              <input type="text" class="form-control form-control-lg contrast-readonly col-7" id="cancelModal-customer" placeholder="" readonly>
            </div>
            <div class="form-group row justify-content-between">
              <label for="cancelModal-deliveryTime" class="col-2">Time</label>
              <input type="text" class="form-control form-control-lg contrast-readonly col-7" id="cancelModal-deliveryTime" placeholder="" readonly>
            </div>
              <div class="input-group mb-3">
                <div class="input-group-prepend">
                  <span class="input-group-text">Reason</span>
                </div>
                <input type="text" class="form-control form-control-lg contrast-rw" id="cancelModal-reason">
              </div>
          </div>
          <div class="modal-footer">
            <div class="row">
              <div class="col-6"><button type="button" class="btn btn-hobart btn-lg" id="cancelModal-keep" data-dismiss="modal">Keep Order</button></div>
              <div class="col-6"><button type="button" class="btn btn-danger btn-lg" id="cancelModal-cancel" data-dismiss="modal">Cancel Order</button></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    {{include}}

    {{block footer}}
    <footer>
    </footer>
    {{end}}
    
    <script src="{{=URL('static','js/jquery-3.2.1.min.js')}}"></script>
    <script src="{{=URL('static','js/popper.min.js')}}"></script>
    <script src="{{=URL('static','js/bootstrap.min.js')}}"></script>
    <script src="{{=URL('static','js/common.js')}}"></script>
    {{block scripts}}
    {{end}}
  </body>
</html>

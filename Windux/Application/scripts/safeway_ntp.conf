# File originated from Safeway, 2/18/2011
# Added comment by Hobart 2/22/2011
# File named safeway.ntp.conf. When installed in a Windux scale rename file and put in directory
# /etc/ntp.conf
# File stored in SourceSafe Windux database at MAINBRANCH_WINDUX/Application/scripts

# Configured as per UNIX-Linux Security Standard 3.7

# tinker flags (modify sacred system parameters):
#	panic 0 = The panic sanity check is disabled and a clock offset of any value will be accepted.

tinker panic 0

# restrict flags (specify access restrictions):
#	ignore = Deny packets of all kinds, including ntpq and ntpdc queries.
#	default = Modifies both IPv4 and IPv6 default entries. 
#	nomodify = Deny ntpq and ntpdc queries which attempt to modify the state of the server
#		(ie., run time reconfiguration). Queries which return information are permitted.
#	notrap = Decline to provide mode 6 control message trap service to matching hosts. The
#		trap service is a subsystem of the ntpdc control message protocol which is intended
#		for use by remote event logging programs.
#	noquery = Deny ntpq and ntpdc queries. Time service is not affected.
#	nopeer = Deny packets that might mobilize an association unless authenticated. This includes
#		broadcast, symmetric-active and manycast server packets when a configured association
#		does not exist. Note that this flag does only apply to packets that do not attempt to
#		mobiize an association.

restrict default ignore
restrict 127.0.0.1
restrict 172.24.0.0 mask 255.255.0.0 nomodify notrap noquery nopeer
restrict 172.26.0.0 mask 255.255.0.0 nomodify notrap noquery nopeer

# driftfile (specify frequency file):

#driftfile /var/lib/ntp/drift  # modified for Ubuntu ntp package
driftfile /var/lib/ntp/ntp.drift

# For stores:
# server = For type s and r addresses (only), this command mobilizes a persistent client mode
#	association with the specified remote server or local reference clock.

server phxntp01.safeway.com
server slcntp01.safeway.com
server phxntp20.safeway.com
server slcntp02.safeway.com

